                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "VelocityNvim is a fast and modern Neovim distribution that uses native vim.pack instead of external plugin managers. It features eager loading for instant plugin availability, LSP integration, Treesitter syntax highlighting, and fzf-lua fuzzy finding."

                "@type": "Question",
                "name": "What are the system requirements for VelocityNvim?",

                    "@type": "Answer",

            },
            {
                "@type": "Question",
                "name": "How do I install VelocityNvim?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "Installation is simple: backup your existing Neovim config, clone the VelocityNvim repository to your Neovim config directory, and run the plugin sync command. The whole process takes about 5 minutes."
                }
            },
            {
                "@type": "Question",
                "name": "Does VelocityNvim use lazy loading?",
                "acceptedAnswer": {
                    "@type": "Answer",
                    "text": "No, VelocityNvim uses eager loading instead of lazy loading. All plugins are loaded at startup, ensuring they are instantly available without any delays during your workflow."
                }
            }
        ]
    }

    <!-- Inline Script: Load Language Preference Before Render (Prevents FOUC) -->
    <script>
        (function() {
            const savedLang = localStorage.getItem('velocityLang');
            if (savedLang === 'en') {
                // Add style tag to hide German and show English immediately
                const style = document.createElement('style');
                style.id = 'lang-preload';
                style.textContent = `
                    .lang-content.de { display: none !important; }
                    .lang-content.en { display: block !important; }
                    .lang-content.en.hero-buttons { display: grid !important; }
                    .lang-content.en.features { display: grid !important; }
                    .lang-content.en.features-grid { display: grid !important; }
                `;
                document.head.appendChild(style);
                document.documentElement.lang = 'en';
                // Update toggle button text on load - show target language (DE since current is EN)
                document.addEventListener('DOMContentLoaded', function() {
                    const toggleBtn = document.querySelector('.nav-lang-toggle');
                    if (toggleBtn) {
                        toggleBtn.textContent = 'DE';
                        toggleBtn.setAttribute('data-lang', 'en');
                    }
                });
            }
        })();
    </script>
