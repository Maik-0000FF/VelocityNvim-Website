    <!-- Inline Script: Apply theme + language before render (prevents FOUC) -->
    <script>
        (function() {
            // THEME — saved override or system preference, default dark
            const savedTheme = localStorage.getItem('velocityTheme');
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            const theme = savedTheme || (prefersLight ? 'light' : 'dark');
            document.documentElement.setAttribute('data-theme', theme);
        })();
        (function() {
            const savedLang = localStorage.getItem('velocityLang');
            if (savedLang === 'en') {
                const style = document.createElement('style');
                style.id = 'lang-preload';
                style.textContent = `
                    .lang-content.de { display: none !important; }
                    .lang-content.en { display: block !important; }
                    .lang-content.en.hero-buttons,
                    .lang-content.en.hero-meta { display: flex !important; }
                    .lang-content.en.features-grid,
                    .lang-content.en.support-grid { display: grid !important; }
                `;
                document.head.appendChild(style);
                document.documentElement.lang = 'en';
                document.addEventListener('DOMContentLoaded', function() {
                    const toggleBtn = document.querySelector('.nav-lang-toggle');
                    if (toggleBtn) {
                        toggleBtn.textContent = 'DE';
                        toggleBtn.setAttribute('data-lang', 'en');
                    }
                });
            }
        })();
    </script>
